name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'Dockerfile'
      - 'docker-bake.hcl'
      - '.github/workflows/docker-publish.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'docker-bake.hcl'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:
    inputs:
      mcp_version:
        description: 'Release version of inkscape-mcp'
        required: false
        default: '1.3.1'
        type: string
      ubuntu_version:
        description: 'Ubuntu version for base image'
        required: false
        default: '24.04'
        type: string
      push:
        description: 'Push image to registries'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v4
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push with Docker Bake
        uses: docker/bake-action@v7
        env:
          MCP_VERSION: ${{ github.event.inputs.mcp_version || '1.3.1' }}
        with:
          files: docker-bake.hcl
          targets: default
          set: |
            *.args.MCP_VERSION=${{ github.event.inputs.mcp_version || '1.3.1' }}
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push == null || github.event.inputs.push == 'true' || github.event.inputs.push == true) }}
